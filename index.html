<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li>MyTicTacToe.com</li>
        </ul>
        <button id="darkToggle" title="Toggle dark mode">🌙</button>
    </nav>

    <!-- Name Entry Screen -->
    <div class="nameScreen" id="nameScreen">
        <div class="nameCard">
            <h2>MyTicTacToe</h2>
            <input type="text" id="playerX" placeholder="Your name" maxlength="16">

            <div class="modeSelect">
                <button class="modeBtn active" id="btnHuman" onclick="setMode('human')">👥 vs Human</button>
                <button class="modeBtn" id="btnCPU" onclick="setMode('computer')">🤖 vs Computer</button>
                <button class="modeBtn" id="btnOnline" onclick="setMode('online')">🌐 Online</button>
            </div>

            <!-- shown only in vs human mode -->
            <input type="text" id="playerO" placeholder="Player O name" maxlength="16">

            <!-- shown only in online mode -->
            <div id="onlineOptions" style="display:none;">
                <button id="createRoomBtn" onclick="createRoom()">🆕 Create Room</button>
                <div class="orDivider">— or —</div>
                <input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="6">
                <button id="joinRoomBtn" onclick="joinRoom()">🚪 Join Room</button>
            </div>

            <div id="roomDisplay" style="display:none;">
                <p>Room Code:</p>
                <div class="roomCode" id="roomCodeDisplay"></div>
                <p class="waitingText">⏳ Waiting for opponent...</p>
            </div>

            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="gameContainer" id="gameContainer" style="display:none;">
        <div class="board-wrap">
            <div class="container">
                <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
                <div class="box bt-0"><span class="boxtext"></span></div>
                <div class="box bt-0 br-0"><span class="boxtext"></span></div>
                <div class="box bl-0"><span class="boxtext"></span></div>
                <div class="box"><span class="boxtext"></span></div>
                <div class="box br-0"><span class="boxtext"></span></div>
                <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
                <div class="box bb-0"><span class="boxtext"></span></div>
                <div class="box bb-0 br-0"><span class="boxtext"></span></div>
            </div>
        </div>

        <div class="gameInfo">
            <h1>Welcome to MyTicTacToe</h1>
            <div class="modeBadge" id="modeBadge">👥 vs Human</div>
            <span class="info" id="info">Turn for X</span>
            <div id="onlineStatus" class="onlineStatus" style="display:none;"></div>
            <button id="reset">Reset</button>
            <button id="changePlayers">Change Players</button>
            <div class="imgbox" id="imgbox">
                <img src="excited.gif" alt="winner">
            </div>

            <!-- Leaderboard -->
            <div class="leaderboard">
                <h2 class="lb-title">🏆 Leaderboard</h2>
                <div id="lbList"></div>
                <button id="clearLb">Clear Board</button>
            </div>
        </div>
    </div>

    <!-- Firebase MUST come before script.js -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

            authDomain: "tic-tac-toe-5d681.firebaseapp.com",

        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="script.js"></script>
</body>
</html>
